<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Do not link every orphan automatically</title>
  <desc id="desc">Disposition tree for valuable, duplicate, replaced, gone, non-search, private, data-artifact, and deliberately isolated orphan candidates.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8d3c32"/></marker></defs>
  <rect width="1200" height="800" fill="#f7f6f2"/>

  <text font-weight="700" font-size="42px" font-family="Arial,sans-serif" fill="#17211f" x="52" y="68">Do not link every orphan automatically</text>
  <rect fill="#304a45" x="400" y="105" width="400" height="70" rx="6"/>
  <text font-weight="700" font-size="25px" font-family="Arial,sans-serif" fill="#fffefa" x="600" y="148" text-anchor="middle">Classify the orphan candidate</text>
  <path fill="none" stroke="#8d3c32" stroke-width="3" d="M600 175V205H160V250M600 205H445V250M600 205H755V250M600 205H1040V250"/>
  <path fill="none" stroke="#8d3c32" stroke-width="3" d="M600 175V480H160V525M600 480H445V525M600 480H755V525M600 480H1040V525"/>
  <g>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="35" y="250" width="250" height="135" rx="6"/><text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="160" y="282" text-anchor="middle">Valuable independent page</text><text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="160" y="330" text-anchor="middle">Link contextually</text>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="320" y="250" width="250" height="135" rx="6"/><text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="445" y="282" text-anchor="middle">Duplicate</text><text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="445" y="323" text-anchor="middle">Canonicalize, merge,</text><text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="445" y="350" text-anchor="middle">or redirect</text>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="630" y="250" width="250" height="135" rx="6"/><text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="755" y="282" text-anchor="middle">Replaced</text><text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="755" y="330" text-anchor="middle">Redirect</text>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="915" y="250" width="250" height="135" rx="6"/><text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="1040" y="282" text-anchor="middle">Gone</text><text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="1040" y="330" text-anchor="middle">404 or 410</text>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="35" y="525" width="250" height="135" rx="6"/><text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="160" y="557" text-anchor="middle">Public, not for search</text><text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="160" y="605" text-anchor="middle">noindex</text>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="320" y="525" width="250" height="135" rx="6"/><text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="445" y="557" text-anchor="middle">Private</text><text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="445" y="605" text-anchor="middle">Authentication</text>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="630" y="525" width="250" height="135" rx="6"/><text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="755" y="557" text-anchor="middle">Data artifact</text><text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="755" y="598" text-anchor="middle">Remove from</text><text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="755" y="625" text-anchor="middle">inventories</text>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="915" y="525" width="250" height="135" rx="6"/><text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="1040" y="557" text-anchor="middle">Deliberately isolated</text><text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="1040" y="598" text-anchor="middle">Document and</text><text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="1040" y="625" text-anchor="middle">monitor</text>
  </g>
  <rect x="52" y="711" width="1096" height="48" fill="#eadfd9"/>
  <text x="600" y="742" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#17211f">Inventory mismatch identifies a candidate. Purpose determines the remedy.</text>
</svg>
