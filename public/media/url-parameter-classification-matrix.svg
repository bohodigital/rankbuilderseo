<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Classify a parameter before controlling it</title>
  <desc id="desc">Matrix comparing parameter purposes by content effect, stability, internal linking, crawling, and indexing.</desc>
  <rect width="1200" height="630" fill="#f7f6f2"/>

