<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Choose the URL control by the outcome</title>
  <desc id="desc">Decision tree comparing redirects, not-found responses, noindex, canonical links, robots.txt, and authentication.</desc>
  <rect width="1200" height="630" fill="#f7f6f2"/>

  <text font-weight="700" font-size="38px" font-family="Arial,sans-serif" fill="#17211f" x="52" y="58">Choose the URL control by the outcome</text>
  <rect fill="#304a45" x="330" y="88" width="540" height="66" rx="6"/>
  <text font-weight="700" font-size="23px" font-family="Arial,sans-serif" fill="#fffefa" x="600" y="130" text-anchor="middle">Should the old URL remain directly accessible?</text>
  <path fill="none" stroke="#8d3c32" stroke-width="3" d="M600 154V178M600 178H260V205M600 178H890V205"/>
  <text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="272" y="197">No</text>
  <text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="843" y="197">Yes</text>
  <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="62" y="210" width="390" height="54" rx="5"/>
  <text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="257" y="244" text-anchor="middle">Direct replacement exists → 301 or 308</text>
  <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="62" y="279" width="390" height="54" rx="5"/>
  <text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="257" y="313" text-anchor="middle">No replacement exists → 404 or 410</text>
  <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="650" y="210" width="490" height="54" rx="5"/>
  <text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="895" y="244" text-anchor="middle">Should it appear independently in search?</text>
  <path fill="none" stroke="#8d3c32" stroke-width="3" d="M895 264V287M725 287H1065M725 287V310M895 287V310M1065 287V310"/>
  <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="650" y="310" width="150" height="68" rx="5"/>
  <text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="725" y="334" text-anchor="middle">No</text>
  <text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="725" y="362" text-anchor="middle">noindex</text>
  <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="820" y="310" width="150" height="68" rx="5"/>
  <text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="895" y="334" text-anchor="middle">Yes, duplicate</text>
  <text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="895" y="362" text-anchor="middle">rel=canonical</text>
  <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="990" y="310" width="150" height="68" rx="5"/>
  <text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="1065" y="334" text-anchor="middle">Yes, distinct</text>
  <text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="1065" y="362" text-anchor="middle">Self-canonical</text>
  <path fill="none" stroke="#8d3c32" stroke-width="3" d="M600 394V416M290 416H910"/>
  <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="82" y="430" width="430" height="70" rx="5"/>
  <text font-weight="700" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="297" y="458" text-anchor="middle">Should crawlers request it?</text>
  <text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="297" y="486" text-anchor="middle">robots.txt</text>
  <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="688" y="430" width="430" height="70" rx="5"/>
  <text font-weight="700" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="903" y="458" text-anchor="middle">Is it private?</text>
  <text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="903" y="486" text-anchor="middle">Authentication</text>
  <rect x="52" y="538" width="1096" height="54" fill="#eadfd9"/>
  <text font-weight="700" font-size="20px" font-family="Georgia,serif" fill="#17211f" x="600" y="572" text-anchor="middle">One primary outcome. Supporting signals should agree.</text>
</svg>
