  </g>
  <rect x="48" y="470" width="1100" height="84" fill="#304a45" rx="5"/>
  <text font-weight="700" font-size="20px" font-family="Georgia,serif" x="598" y="505" text-anchor="middle" fill="#fffefa">Keep raw evidence separate from normalized analytical fields.</text>
  <text font-weight="700" font-size="20px" font-family="Georgia,serif" x="598" y="535" text-anchor="middle" fill="#fffefa">A verified requester still needs an honest category and scope.</text>
</svg>
