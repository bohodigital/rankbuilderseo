<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">From raw request logs to a defensible crawl diagnosis</title>
  <desc id="desc">Eight-stage pipeline for preserving, verifying, normalizing, classifying, aggregating, investigating, and reporting crawler requests.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8d3c32"/></marker></defs>
  <rect width="1200" height="630" fill="#f7f6f2"/>

  <text font-weight="700" font-size="36px" font-family="Arial,sans-serif" fill="#17211f" x="48" y="58">From raw request logs to a defensible crawl diagnosis</text>
  <g>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="48" y="126" width="230" height="94" rx="5"/><text font-weight="700" font-size="17px" font-family="Courier New,monospace" fill="#8d3c32" x="68" y="155">01</text><text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="163" y="180" text-anchor="middle">Raw edge or</text><text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="163" y="203" text-anchor="middle">origin logs</text>
    <path fill="none" stroke="#8d3c32" stroke-width="3" d="M278 173H338"/>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="338" y="126" width="230" height="94" rx="5"/><text font-weight="700" font-size="17px" font-family="Courier New,monospace" fill="#8d3c32" x="358" y="155">02</text><text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="453" y="191" text-anchor="middle">Preserve source</text>
    <path fill="none" stroke="#8d3c32" stroke-width="3" d="M568 173H628"/>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="628" y="126" width="230" height="94" rx="5"/><text font-weight="700" font-size="17px" font-family="Courier New,monospace" fill="#8d3c32" x="648" y="155">03</text><text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="743" y="191" text-anchor="middle">Verify crawler</text>
    <path fill="none" stroke="#8d3c32" stroke-width="3" d="M858 173H918"/>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="918" y="126" width="230" height="94" rx="5"/><text font-weight="700" font-size="17px" font-family="Courier New,monospace" fill="#8d3c32" x="938" y="155">04</text><text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="1033" y="191" text-anchor="middle">Normalize URLs</text>
    <path fill="none" stroke="#8d3c32" stroke-width="3" d="M1033 220V286H1030"/>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="918" y="286" width="230" height="112" rx="5"/><text font-weight="700" font-size="17px" font-family="Courier New,monospace" fill="#8d3c32" x="938" y="315">05</text><text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="1033" y="342" text-anchor="middle">Classify template</text><text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="1033" y="366" text-anchor="middle">and status</text>
    <path fill="none" stroke="#8d3c32" stroke-width="3" d="M918 342H858"/>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="628" y="286" width="230" height="112" rx="5"/><text font-weight="700" font-size="17px" font-family="Courier New,monospace" fill="#8d3c32" x="648" y="315">06</text><text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="743" y="354" text-anchor="middle">Aggregate</text>
    <path fill="none" stroke="#8d3c32" stroke-width="3" d="M628 342H568"/>
    <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="338" y="286" width="230" height="112" rx="5"/><text font-weight="700" font-size="17px" font-family="Courier New,monospace" fill="#8d3c32" x="358" y="315">07</text><text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="453" y="354" text-anchor="middle">Investigate</text>
    <path fill="none" stroke="#8d3c32" stroke-width="3" d="M338 342H278"/>
