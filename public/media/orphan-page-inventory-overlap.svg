<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">A crawler cannot list pages it never found</title>
  <desc id="desc">Overlapping page inventories reveal URLs known outside the internal crawler inventory.</desc>
  <rect width="1200" height="630" fill="#f7f6f2"/>

  <text font-weight="700" font-size="38px" font-family="Arial,sans-serif" fill="#17211f" x="48" y="58">A crawler cannot list pages it never found</text>
  <ellipse fill-opacity=".22" stroke-width="3" cx="400" cy="255" rx="280" ry="145" fill="#eadfd9" stroke="#8d3c32"/>
  <ellipse fill-opacity=".22" stroke-width="3" cx="610" cy="235" rx="275" ry="145" fill="#b9cdc8" stroke="#304a45"/>
  <ellipse fill-opacity=".22" stroke-width="3" cx="790" cy="300" rx="280" ry="145" fill="#f2d7ad" stroke="#8d6b32"/>
  <ellipse fill-opacity=".22" stroke-width="3" cx="480" cy="380" rx="280" ry="145" fill="#d7d2e5" stroke="#64577e"/>
  <ellipse fill-opacity=".22" stroke-width="3" cx="730" cy="395" rx="280" ry="145" fill="#c8d7c2" stroke="#4f7048"/>
  <text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="185" y="175">CMS inventory</text>
  <text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="520" y="125">Sitemap inventory</text>
  <text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="840" y="220">Analytics and</text><text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="840" y="246">Search Console</text>
  <text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="210" y="466">Logs and external discovery</text>
  <text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="800" y="492">Internal crawler</text>
  <path d="M455 255h310v92H455z" fill="#304a45" stroke="#17211f" stroke-width="2"/>
  <text font-weight="700" font-size="22px" font-family="Arial,sans-serif" fill="#fffefa" x="610" y="293" text-anchor="middle">Known elsewhere but absent</text>
  <text font-weight="700" font-size="22px" font-family="Arial,sans-serif" fill="#fffefa" x="610" y="323" text-anchor="middle">from internal crawl</text>
  <text font-weight="400" font-size="20px" font-family="Georgia,serif" fill="#535c57" x="600" y="594" text-anchor="middle">Compare independent inventories; no single source can prove the complete public URL set.</text>
</svg>
