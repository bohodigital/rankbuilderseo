<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Crawl Stats measures requests, not rankings</title>
  <desc id="desc">Google crawl activity branches into request, download, timing, host, response, file, purpose, and crawler-type metrics.</desc>
  <rect width="1200" height="630" fill="#f7f6f2"/>

  <text font-weight="700" font-size="38px" font-family="Arial,sans-serif" fill="#17211f" x="48" y="58">Crawl Stats measures requests, not rankings</text>
  <rect fill="#304a45" x="430" y="255" width="340" height="84" rx="42"/>
  <text font-weight="700" font-size="26px" font-family="Arial,sans-serif" fill="#fffefa" x="600" y="307" text-anchor="middle">Google crawl activity</text>
  <g stroke="#8d3c32" stroke-width="3">
    <path d="M470 270L250 165"/><path d="M525 255L470 135"/><path d="M675 255L730 135"/><path d="M730 270L950 165"/>
    <path d="M470 324L250 430"/><path d="M525 339L470 465"/><path d="M675 339L730 465"/><path d="M730 324L950 430"/>
  </g>
  <g>
    <rect fill="#fffefa" stroke="#8d3c32" stroke-width="2" x="75" y="120" width="200" height="66" rx="5"/><text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="175" y="161" text-anchor="middle">Requests</text>
    <rect fill="#fffefa" stroke="#8d3c32" stroke-width="2" x="365" y="90" width="210" height="66" rx="5"/><text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="470" y="131" text-anchor="middle">Download size</text>
    <rect fill="#fffefa" stroke="#8d3c32" stroke-width="2" x="625" y="90" width="210" height="66" rx="5"/><text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="730" y="131" text-anchor="middle">Response time</text>
    <rect fill="#fffefa" stroke="#8d3c32" stroke-width="2" x="925" y="120" width="200" height="66" rx="5"/><text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="1025" y="161" text-anchor="middle">Host status</text>
    <rect fill="#fffefa" stroke="#8d3c32" stroke-width="2" x="75" y="407" width="200" height="66" rx="5"/><text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="175" y="448" text-anchor="middle">Response codes</text>
    <rect fill="#fffefa" stroke="#8d3c32" stroke-width="2" x="365" y="442" width="210" height="66" rx="5"/><text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="470" y="483" text-anchor="middle">File types</text>
    <rect fill="#fffefa" stroke="#8d3c32" stroke-width="2" x="625" y="442" width="210" height="66" rx="5"/><text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="730" y="483" text-anchor="middle">Crawl purpose</text>
    <rect fill="#fffefa" stroke="#8d3c32" stroke-width="2" x="925" y="407" width="200" height="66" rx="5"/><text font-weight="700" font-size="20px" font-family="Arial,sans-serif" fill="#17211f" x="1025" y="448" text-anchor="middle">Googlebot type</text>
  </g>
  <rect x="48" y="545" width="1104" height="55" fill="#eadfd9"/>
  <text font-weight="700" font-size="20px" font-family="Georgia,serif" fill="#17211f" x="600" y="579" text-anchor="middle">Does not establish indexing, canonical selection, ranking, or traffic.</text>
</svg>
