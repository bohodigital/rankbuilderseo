<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Move from observation to evidence</title>
  <desc id="desc">Diagnostic matrix connecting Crawl Stats observations with causes, evidence, and conclusions the report cannot support.</desc>
  <rect width="1200" height="800" fill="#f7f6f2"/>

  <text font-weight="700" font-size="42px" font-family="Arial,sans-serif" fill="#17211f" x="42" y="62">Move from observation to evidence</text>
  <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="42" y="96" width="1116" height="624"/>
  <rect x="42" y="96" width="1116" height="74" fill="#304a45"/>
  <path stroke="#aeb4ad" stroke-width="1" d="M270 96V720M550 96V720M865 96V720"/><path stroke="#aeb4ad" stroke-width="1" d="M42 170H1158M42 280H1158M42 390H1158M42 500H1158M42 610H1158"/>
  <text font-weight="700" font-size="19px" font-family="Arial,sans-serif" fill="#fffefa" x="156" y="140" text-anchor="middle">Observation</text><text font-weight="700" font-size="19px" font-family="Arial,sans-serif" fill="#fffefa" x="410" y="140" text-anchor="middle">Possible cause</text><text font-weight="700" font-size="19px" font-family="Arial,sans-serif" fill="#fffefa" x="707" y="140" text-anchor="middle">Confirming evidence</text><text font-weight="700" font-size="19px" font-family="Arial,sans-serif" fill="#fffefa" x="1011" y="140" text-anchor="middle">Invalid conclusion</text>
  <g>
    <text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="58" y="205">More discovery</text><text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="58" y="229">requests</text>
    <text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="286" y="205">New or newly linked</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="286" y="229">URL inventory</text>
    <text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="195">Logs show new paths;</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="219">sitemap or release event</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="243">matches the timing</text>
    <text font-weight="700" font-size="17px" font-family="Arial,sans-serif" fill="#8d3c32" x="881" y="205">“More pages are</text><text font-weight="700" font-size="17px" font-family="Arial,sans-serif" fill="#8d3c32" x="881" y="229">now indexed”</text>

    <text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="58" y="325">More 5xx responses</text>
    <text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="286" y="315">Origin, application,</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="286" y="339">or dependency failure</text>
    <text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="305">Request logs and traces</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="329">identify status, layer,</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="353">template, and timing</text>
    <text font-weight="700" font-size="17px" font-family="Arial,sans-serif" fill="#8d3c32" x="881" y="315">“Google caused</text><text font-weight="700" font-size="17px" font-family="Arial,sans-serif" fill="#8d3c32" x="881" y="339">the outage”</text>

    <text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="58" y="435">Slower responses</text>
    <text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="286" y="425">Backend latency, cache</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="286" y="449">misses, or larger work</text>
    <text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="415">Layer-specific timing,</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="439">cache status, and traces</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="463">move together</text>
    <text font-weight="700" font-size="17px" font-family="Arial,sans-serif" fill="#8d3c32" x="881" y="425">“Rankings fell because</text><text font-weight="700" font-size="17px" font-family="Arial,sans-serif" fill="#8d3c32" x="881" y="449">this chart rose”</text>

    <text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="58" y="545">More redirects</text>
    <text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="286" y="535">Stale links, moved URLs,</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="286" y="559">or normalization</text>
    <text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="525">Logs identify sources,</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="549">targets, chains, and</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="573">request families</text>
    <text font-weight="700" font-size="17px" font-family="Arial,sans-serif" fill="#8d3c32" x="881" y="535">“Redirects are always</text><text font-weight="700" font-size="17px" font-family="Arial,sans-serif" fill="#8d3c32" x="881" y="559">wasted crawl”</text>

    <text font-weight="700" font-size="18px" font-family="Arial,sans-serif" fill="#17211f" x="58" y="655">Lower crawl volume</text>
    <text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="286" y="645">Less demand, fewer URLs,</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="286" y="669">or serving constraints</text>
    <text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="635">Logs, host status, links,</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="659">sitemaps, and releases</text><text font-weight="400" font-size="17px" font-family="Arial,sans-serif" fill="#17211f" x="566" y="683">narrow the explanation</text>
    <text font-weight="700" font-size="17px" font-family="Arial,sans-serif" fill="#8d3c32" x="881" y="645">“The site is penalized”</text>
  </g>
  <text x="42" y="764" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#535c57">The chart starts a diagnosis. It does not finish one.</text>
</svg>
