<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Update lastmod only for a meaningful page change</title>
  <desc id="desc">Decision tree for preserving, updating, or omitting an XML sitemap lastmod value.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8d3c32"/></marker></defs>
  <rect width="1200" height="630" fill="#f7f6f2"/>

  <text font-weight="700" font-size="38px" font-family="Arial,sans-serif" fill="#17211f" x="48" y="58">Update lastmod only for a meaningful page change</text>
  <polygon fill="#eadfd9" stroke="#8d3c32" stroke-width="2" points="600,92 830,157 600,222 370,157"/>
  <text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="600" y="165" text-anchor="middle">Did the meaningful public page change?</text>
  <path fill="none" stroke="#8d3c32" stroke-width="3" d="M370 157H180V280"/>
  <text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="240" y="142">No</text>
  <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="65" y="280" width="300" height="82" rx="5"/>
  <text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="215" y="329" text-anchor="middle">Preserve previous lastmod</text>
  <path fill="none" stroke="#8d3c32" stroke-width="3" d="M830 157H1000V245"/>
  <text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="920" y="142">Yes</text>
  <polygon fill="#eadfd9" stroke="#8d3c32" stroke-width="2" points="895,245 1120,310 895,375 670,310"/>
  <text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="895" y="304" text-anchor="middle">Is the modification date</text><text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="895" y="332" text-anchor="middle">reliable?</text>
  <path fill="none" stroke="#8d3c32" stroke-width="3" d="M780 352L620 430"/>
  <text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="676" y="382">Yes</text>
  <rect fill="#304a45" x="435" y="430" width="310" height="78" rx="5"/>
  <text font-weight="700" font-size="22px" font-family="Arial,sans-serif" fill="#fffefa" x="590" y="478" text-anchor="middle">Update lastmod</text>
  <path fill="none" stroke="#8d3c32" stroke-width="3" d="M1010 352L1100 430"/>
  <text font-weight="700" font-size="18px" font-family="Courier New,monospace" fill="#8d3c32" x="1052" y="382">No</text>
  <rect fill="#fffefa" stroke="#304a45" stroke-width="2" x="820" y="430" width="335" height="78" rx="5"/>
  <text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="987" y="461" text-anchor="middle">Omit lastmod instead of</text><text font-weight="700" font-size="21px" font-family="Arial,sans-serif" fill="#17211f" x="987" y="488" text-anchor="middle">inventing a date</text>
  <rect x="48" y="548" width="1104" height="52" fill="#eadfd9"/>
  <text font-weight="700" font-size="21px" font-family="Georgia,serif" fill="#17211f" x="600" y="581" text-anchor="middle">Build time is not automatically modification time.</text>
</svg>
